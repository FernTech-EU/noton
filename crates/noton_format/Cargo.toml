[package]
name = "noton-format"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
# `rc`: `Asset::bytes` is a shared `Arc<[u8]>`.
serde = { workspace = true, features = ["rc"] }
uuid.workspace = true
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
fs2 = "0.4"
blake3 = "1"
[dev-dependencies]
tempfile = "3"
